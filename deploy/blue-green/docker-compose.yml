# Blue-green deployment simulation (Assignment 6).
# Two versions of the backend run side by side; the nginx proxy sends all
# traffic to the "active" one. Switching = change the proxy's upstream and
# reload nginx gracefully — no container is stopped, so no request fails.
#
# Use the helper script from the repository root:
#   deploy/blue-green/bluegreen.sh up | status | switch green | switch blue | down

name: car-bluegreen

x-backend: &backend
  build: ../../backend
  restart: unless-stopped
  depends_on:
    mongodb:
      condition: service_healthy
  networks: [bluegreen]
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    networks: [bluegreen]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Current production version
  backend-blue:
    <<: *backend
    environment: &backend-env
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/cardb # both colours share ONE database
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      CLIENT_URL: http://localhost:5173
      APP_VERSION: "1.0.0"
      APP_COLOR: blue

  # New version being released
  backend-green:
    <<: *backend
    environment:
      <<: *backend-env
      APP_VERSION: "1.1.0"
      APP_COLOR: green

  # The only entry point: clients always call http://localhost:5002
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "5002:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d # default.conf + active-upstream (which colour is live)
    depends_on: [backend-blue, backend-green]
    networks: [bluegreen]

networks:
  bluegreen:
