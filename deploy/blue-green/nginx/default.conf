upstream backend {
  # Written by bluegreen.sh: "server backend-blue:5000;" or "server backend-green:5000;"
  include /etc/nginx/conf.d/active-upstream;
}

server {
  listen 80;

  location / {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Served-By $upstream_addr always; # shows which container answered
  }
}
