server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths (/cars, /cars/123/edit) get index.html
  # and React Router renders the right page.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change, so browsers may cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
